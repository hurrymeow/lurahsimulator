name: Android bundle

# Manual build of the signed Play Store bundle (TWA via Bubblewrap).
# Secrets: ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Play versionCode (must rise on every upload)
        required: true
        default: '1'
      version_name:
        description: Version name shown to users
        required: true
        default: '1.0.0'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@1.24.1
      - name: Point Bubblewrap at the JDK and Android SDK
        run: |
          # Use the runner's preinstalled SDK, with licences accepted.
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {"jdkPath":"$JAVA_HOME","androidSdkPath":"$SDK"}
          EOF
      - name: Build
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VCODE: ${{ inputs.version_code }}
          VNAME: ${{ inputs.version_name }}
        run: |
          test -n "$KS_B64" || { echo "ANDROID_KEYSTORE_B64 is empty"; exit 1; }
          echo "$KS_B64" | base64 -d > android.keystore
          jq --argjson c "$VCODE" --arg n "$VNAME" '.appVersion=($c|tostring)|.appVersionName=$n' twa-manifest.json > t.json && mv t.json twa-manifest.json
          # Build generates the Android project from twa-manifest.json and accepts the SDK licences.
          yes | bubblewrap build --skipPwaValidation
          ls -la *.aab
      - name: Remove keystore
        if: always()
        run: rm -f android/android.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: pak-pejabat-aab
          path: |
            android/app-release-bundle.aab
            android/twa-manifest.json
