# Redraws the screenshot baselines in CI's own Playwright image and commits them to the branch it ran on.
# Run it by hand (Actions > Update baselines > Run workflow, pick the branch) only for an intended visual change.
# Attach the before and after to the PR. See UI.md.
name: Update baselines

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test visual.spec --project=phone-412-id --update-snapshots
        env:
          CI: 'true'
      - name: Commit the baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/visual.spec.ts-snapshots
          git diff --cached --quiet && echo "Baselines unchanged." && exit 0
          git commit -m "Update screenshot baselines"
          git push
      # A push made with the default token does not start CI, and a run the bot starts needs approval.
      # Start CI here as a workflow_dispatch run instead.
      - name: Start CI on the new baselines
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff HEAD~1 --quiet -- tests/e2e/visual.spec.ts-snapshots && exit 0
          curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -d "{\"ref\":\"$GITHUB_REF_NAME\"}"
