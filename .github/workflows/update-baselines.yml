# Redraws the screenshot baselines in CI's own Playwright image and commits them to the branch it ran on.
# Run it by hand (Actions > Update baselines > Run workflow, pick the branch) only for an intended visual change.
# Attach the before and after to the PR. See UI.md.
name: Update baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test visual.spec --project=phone-412-en --project=phone-412-id --update-snapshots
        env:
          CI: 'true'
      - name: Commit the baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/visual.spec.ts-snapshots
          git diff --cached --quiet && echo "Baselines unchanged." && exit 0
          git commit -m "Update screenshot baselines"
          git push
