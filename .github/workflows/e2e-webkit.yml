# WebKit nightly (TESTING.md item 13): the whole e2e suite in WebKit at 412px, Indonesian, the iPhone engine.
# PR CI stays Chromium. A failure here is a TODO item, not a blocked PR.
name: E2E WebKit

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Screenshot baselines are drawn in Chromium, so WebKit skips the visual spec.
      - run: npx playwright test tests/e2e/ui.spec.ts tests/e2e/canary.spec.ts --project=webkit-phone-412-id --shard=${{ matrix.shard }}/3
        env:
          CI: 'true'
          E2E_BROWSER: webkit
      - if: always()
        run: node scripts/flaky-summary.mjs reports/results.json "WebKit 412, shard ${{ matrix.shard }}" >> "$GITHUB_STEP_SUMMARY"
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-webkit-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7
