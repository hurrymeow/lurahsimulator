<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="description" content="A satirical kampung management sim. Every joke moves a number." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Pak RT</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <h1 class="title">Pak RT</h1>
        <div class="top-actions">
          <button id="install-btn" class="btn btn-ghost" hidden>Install</button>
          <button id="help-btn" class="btn btn-icon" aria-label="How to play">?</button>
          <button id="settings-btn" class="btn btn-icon" aria-label="Settings">⚙</button>
        </div>
      </header>
      <div id="update-banner" class="banner" role="status" hidden>
        <span>New version ready.</span>
        <button id="update-btn" class="btn btn-primary">Update</button>
      </div>
      <div id="hud" role="button" aria-label="Resources"></div>
      <div id="emas" class="emas" aria-label="Indonesia Emas 2045 progress">
        <span class="emas-label">Indonesia Emas 2045</span>
        <div class="emas-track"><div id="emas-fill"></div></div>
        <span id="emas-value" class="emas-value">0.01%</span>
      </div>
      <button id="ticker" class="ticker" aria-live="polite">Welcome, Pak RT.</button>
      <main id="stage">
        <canvas id="map" aria-label="Kampung map"></canvas>
      </main>
      <footer id="bottombar">
        <div class="row">
          <div id="speed" class="segmented" role="group" aria-label="Speed"></div>
          <div class="date-wrap">
            <span id="date"></span>
            <div class="month-track"><div id="month-progress"></div></div>
          </div>
        </div>
        <nav id="actions" class="row" aria-label="Actions"></nav>
        <div id="placebar" class="row" hidden>
          <div id="place-info" class="place-info"></div>
          <button id="place-cancel" class="btn">Cancel</button>
          <button id="place-ok" class="btn btn-primary" disabled>Place</button>
        </div>
      </footer>
      <div id="howto" role="dialog" aria-modal="true" aria-labelledby="howtoTitle" hidden></div>
      <div id="scrim" class="scrim" hidden></div>
      <div id="sheet" class="sheet" hidden></div>
      <div id="modal" class="modal" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
