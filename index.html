<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="description" content="A satirical kampung management sim. Every joke moves a number." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pak Pejabat" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Pak Pejabat</title>
  </head>
  <body>
    <div id="app">
      <h1 class="sr-only">Pak Pejabat</h1>
      <header id="hud" role="group" data-i18n-aria="page.hud" aria-label="Resources. Tap one to learn what it does."></header>
      <!-- One status row: the current goal (tap for the next star) and a compact Indonesia Emas meter. -->
      <div id="status" class="status-row">
        <div id="goal" class="goal" hidden></div>
        <div id="emas" class="emas" role="button" tabindex="0" data-i18n-aria="page.emas" aria-label="Indonesia Emas 2045 progress">
          <span class="emas-label">2045</span>
          <div class="emas-track"><div id="emas-fill"></div></div>
          <span id="emas-value" class="emas-value">0.01%</span>
        </div>
      </div>
      <div id="update-banner" class="banner" role="status" hidden>
        <span data-i18n="page.updateReady">New version ready.</span>
        <button id="update-btn" class="btn btn-primary" data-i18n="page.update">Update</button>
      </div>
      <main id="stage">
        <button id="ticker" class="ticker notice-toast" aria-live="polite" hidden data-i18n="page.welcome">Welcome, Pak RT.</button>
        <canvas id="map" data-i18n-aria="page.map" aria-label="Kampung map"></canvas>
        <div id="dof" aria-hidden="true"></div>
        <div id="place-float" class="place-float" hidden>
          <button id="place-cancel" class="btn" data-i18n="page.cancel">Cancel</button>
          <button id="place-ok" class="btn btn-primary" disabled data-i18n="page.place">Place</button>
        </div>
        <div id="auto-pause" role="status" hidden data-i18n="page.autoPaused">Paused</div>
      </main>
      <footer id="bottombar">
        <div id="mainbar" class="row">
          <button id="pause-btn" class="btn btn-icon" aria-label="Pause">❚❚</button>
          <button id="speed-btn" class="btn">1x</button>
          <div class="date-wrap">
            <span id="date"></span>
            <div class="month-track"><div id="month-progress"></div></div>
          </div>
          <button id="menu-btn" class="btn btn-primary" aria-haspopup="dialog" data-i18n="page.menu">Menu</button>
        </div>
        <div id="placebar" class="row" hidden>
          <div id="place-info" class="place-info"></div>
          <button id="place-exit" class="btn" data-i18n="page.cancel">Cancel</button>
        </div>
      </footer>
      <div id="howto" role="dialog" aria-modal="true" aria-labelledby="howtoTitle" hidden></div>
      <div id="scrim" class="scrim" hidden></div>
      <div id="sheet" class="sheet" hidden></div>
      <div id="modal" class="modal" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
