<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="description" content="A satirical kampung management sim. Every joke moves a number." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Pak RT</title>
  </head>
  <body>
    <div id="app">
      <h1 class="sr-only">Pak RT</h1>
      <header id="hud" role="button" tabindex="0" data-i18n-aria="page.hud" aria-label="Sumber daya. Ketuk untuk rincian."></header>
      <div id="emas" class="emas" data-i18n-aria="page.emas" aria-label="Kemajuan Indonesia Emas 2045">
        <span class="emas-label">Indonesia Emas 2045</span>
        <div class="emas-track"><div id="emas-fill"></div></div>
        <span id="emas-value" class="emas-value">0.01%</span>
      </div>
      <div id="update-banner" class="banner" role="status" hidden>
        <span data-i18n="page.updateReady">Versi baru siap.</span>
        <button id="update-btn" class="btn btn-primary" data-i18n="page.update">Perbarui</button>
      </div>
      <button id="ticker" class="ticker" aria-live="polite" data-i18n="page.welcome">Selamat datang, Pak RT.</button>
      <main id="stage">
        <canvas id="map" data-i18n-aria="page.map" aria-label="Peta kampung"></canvas>
      </main>
      <footer id="bottombar">
        <div id="mainbar" class="row">
          <button id="pause-btn" class="btn btn-icon" aria-label="Jeda">❚❚</button>
          <button id="speed-btn" class="btn">1x</button>
          <div class="date-wrap">
            <span id="date"></span>
            <div class="month-track"><div id="month-progress"></div></div>
          </div>
          <button id="menu-btn" class="btn btn-primary" aria-haspopup="dialog" data-i18n="page.menu">Menu</button>
        </div>
        <div id="placebar" class="row" hidden>
          <div id="place-info" class="place-info"></div>
          <button id="place-cancel" class="btn" data-i18n="page.cancel">Batal</button>
          <button id="place-ok" class="btn btn-primary" disabled data-i18n="page.place">Pasang</button>
        </div>
      </footer>
      <div id="howto" role="dialog" aria-modal="true" aria-labelledby="howtoTitle" hidden></div>
      <div id="scrim" class="scrim" hidden></div>
      <div id="sheet" class="sheet" hidden></div>
      <div id="modal" class="modal" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
