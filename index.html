<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="description" content="A satirical kampung management sim. Every joke moves a number." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Pak RT</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <h1 class="title">Pak RT</h1>
        <div class="top-actions">
          <button id="install-btn" class="btn btn-ghost" hidden>Install</button>
          <button id="settings-btn" class="btn btn-icon" aria-label="Settings">⚙</button>
        </div>
      </header>
      <div id="update-banner" class="banner" role="status" hidden>
        <span>New version ready.</span>
        <button id="update-btn" class="btn btn-primary">Update</button>
      </div>
      <main id="stage">
        <canvas id="map" aria-label="Kampung map"></canvas>
      </main>
      <nav id="bottombar" aria-label="Actions"></nav>
      <div id="sheet" class="sheet" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
